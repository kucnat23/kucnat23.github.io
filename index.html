<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <title>Influencerka: Cesta do Paříže</title>
    <link rel="stylesheet" href="stylopis.css">
</head>
<body>

    <header>
        <div class="header-banner">
            <h1>Influencerka: Cesta do Paříže</h1>
        </div>
    </header>

    <main>
        <div class="window">
            <div class="window-header">
                <span class="dots">● ● ●</span>
                <span class="window-title">Paris_Adventure.exe</span>
                <span class="hearts">♥♥♥♥♥</span>
                <span class="close-btn">X</span>
            </div>
            
            <div class="window-content">
                <div id="image-box"><img src="img/uvod.jpeg" alt=""></div>
                
                <p id="story-text">Vítej! Jsi známá Influencerka a vydáš se na event do Paříže. Po příletu tě budou čekat situace, u kterých se buděš muset správně rozhodnout.</p>

                <div id="interaction-area">
                    <button id="start-btn" onclick="startHry()">START HRY</button>
                    <div id="choices" style="display: none;">
                        <button id="btn1" onclick="volba(1)">Možnost A</button>
                        <button id="btn2" onclick="volba(2)">Možnost B</button>
                        <button id="btn3" onclick="volba(3)">Možnost C</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
